{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="register-container"> <h2>Create Your Account</h2> <form method="POST"> {% csrf_token %} <div class="form-group"> <label for="username">Username</label> <input type="text" id="username" name="username" placeholder="Enter your username" required > </div> <div class="form-group"> <label for="email">Email</label> <input type="email" id="email" name="email" placeholder="Enter your email" required > </div> <div class="form-group"> <label for="password1">Password</label> <input type="password" id="password1" name="password1" placeholder="Create a password" required > </div> <div class="form-group"> <label for="password2">Confirm Password</label> <input type="password" id="password2" name="password2" placeholder="Confirm your password" required > </div> <button type="submit">Register</button> </form> <p class="login-link"> Already have an account? <a href="{% url 'login' %}">Login here</a> </p>
{% endblock %}
